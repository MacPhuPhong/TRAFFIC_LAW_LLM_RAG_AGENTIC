services:
  qdrant:
    image: qdrant/qdrant:v1.14.1
    container_name: traffic_qdrant
    restart: unless-stopped
    volumes:
      - ../qdrant_storage:/qdrant/storage
    networks:
      - traffic_net

  backend:
    build:
      context: ../..
      dockerfile: traffic_rag/deploy/Dockerfile.backend
    container_name: traffic_backend
    restart: unless-stopped
    env_file:
      - ../../.env
    environment:
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
    volumes:
      - ../checkpoints:/app/traffic_rag/checkpoints
      - ../Data:/app/traffic_rag/Data:ro
      - hf_cache:/app/.cache/huggingface
    depends_on:
      - qdrant
    networks:
      - traffic_net

  frontend:
    build:
      context: ../..
      dockerfile: traffic_rag/deploy/Dockerfile.frontend
    container_name: traffic_frontend
    restart: unless-stopped
    env_file:
      - .env.frontend
    volumes:
      - frontend_db:/app/prisma
    depends_on:
      - backend
    networks:
      - traffic_net

  nginx:
    image: nginx:1.27-alpine
    container_name: traffic_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
    networks:
      - traffic_net

networks:
  traffic_net:
    driver: bridge

volumes:
  hf_cache:
  frontend_db:
